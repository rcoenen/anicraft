sonar.projectKey=storytold_anicraft
sonar.organization=storytold

# CI only publishes the Rust lcov report, so JS, PowerShell and Python never
# appear covered. Same idea as filmcraft and lightcraft excluding tools/docs.
sonar.coverage.exclusions=**/*.js,**/*.ps1,**/*.py,packaging/**

# Declaring test files turns off Sonar's default sources: state them, or the analysis indexes
# only the packaging tests and the gate means nothing.
sonar.sources=.
sonar.tests=packaging,tests,src
sonar.test.inclusions=packaging/*-tests.py,packaging/macos/*_tests.py,packaging/**/*-tests.ps1,**/*_tests.rs,**/tests/**
