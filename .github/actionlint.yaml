# Custom runner labels actionlint can't know about.
self-hosted-runner:
  labels:
    - github-ubuntu-16core  # org 16-core larger runner, used by the FreeBSD VM jobs (release.yml, freebsd.yml)

# actionlint 1.7.12 predates GitHub's queue key. Only this exact false positive is
# suppressed; nightly-release-tests.py enforces the exact concurrency block contract.
paths:
  .github/workflows/nightly-sign.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
